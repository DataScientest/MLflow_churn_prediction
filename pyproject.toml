[project]
name = "churn-prediction"
version = "0.1.0"
description = "Churn prediction project for MLflow course"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "mlflow==3.16.1",
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "psycopg2-binary==2.9.13",
    "gunicorn==26.2.0",
    "requests==2.34.2",
    "langchain==1.4.2",
    "langchain-core==1.6.4",
    "langchain-openai==1.6.4",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.12",
    "chromadb==1.5.9",
    "openai==3.19.0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call a real LLM endpoint (need OPENAI_API_KEY / OPENAI_BASE_URL); disabled by default",
]
addopts = "-m \"not live\""
